# Định nghĩa nhóm các ứng dụng backend (Node.js)
upstream laptop_app {
    # Dùng thuật toán Round Robin mặc định để phân phối tải
    # app1 và app2 là tên service trong docker-compose
    server app1:3000;
    server app2:3000;
}

server {
    # Nginx lắng nghe trên cổng 80 (cổng web mặc định)
    listen 80;

    # Định nghĩa tên server
    server_name localhost;

    # Cấu hình log
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Khi có request tới / (hoặc bất kỳ path nào), proxy nó đến nhóm upstream
    location / {
        # Đặt tiêu đề (header) để biết request đi qua Nginx
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Chuyển tiếp request đến nhóm server Node.js
        proxy_pass http://laptop_app;

        # Tăng timeout để xử lý request lớn (nếu cần)
        proxy_read_timeout 600;
        proxy_connect_timeout 600;

        # Ngăn chặn Nginx cache response của backend
        proxy_buffering off;
    }

    # Cấu hình cho route kiểm tra sức khỏe (Health Check)
    # Load balancer có thể dùng route này để kiểm tra xem instance nào còn hoạt động
    location /health {
        proxy_pass http://laptop_app/health;
        proxy_set_header Host $host;
    }
}
